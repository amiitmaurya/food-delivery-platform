<div class="edit-profile-page container my-4">
  <div class="glass-card profile-card p-4">
    <div class="profile-header text-center mb-4">
      <div class="avatar-wrapper">
        <img [src]="profileData.profileImageUrl || defaultAvatar" (error)="onAvatarError($event)" alt="Profile Picture" class="profile-avatar" />
      </div>
      <h2 class="mt-3 font-weight-bold">{{ profileData.fullName }}</h2>
      <p class="text-muted small">{{ profileData.email }}</p>
    </div>

    <form (ngSubmit)="saveProfile()">
      <div class="form-group mb-3">
        <label class="form-label">Profile Image (Optional)</label>
        <input type="file" accept="image/*" (change)="onFileSelected($event)" class="form-control" />
        <small class="text-muted d-block mt-1">Upload profile picture or leave blank to use default image.</small>
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Full Name *</label>
        <input type="text" [(ngModel)]="profileData.fullName" name="fullName" class="form-control" placeholder="e.g. Amit Maurya" />
      </div>

      <div class="form-row row mb-3">
        <div class="col-md-6 form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" [(ngModel)]="profileData.email" name="email" class="form-control" placeholder="user@domain.com" />
        </div>

        <div class="col-md-6 form-group">
          <label class="form-label">Phone Number</label>
          <div class="input-phone-container">
            <span class="input-phone-prefix">+91</span>
            <input 
              type="tel" 
              [(ngModel)]="profileData.phoneNumber" 
              name="phoneNumber" 
              class="form-control" 
              placeholder="9876543210" 
              maxlength="10"
              inputmode="numeric"
              (keypress)="onlyNumbers($event)"
              (input)="onPhoneInput($event)"
            />
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" routerLink="/restaurant" class="btn btn-secondary me-2">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i> Save Profile</button>
      </div>
    </form>
  </div>
</div>
