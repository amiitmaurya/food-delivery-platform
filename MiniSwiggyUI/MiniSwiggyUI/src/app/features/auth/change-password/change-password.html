<div class="change-password-page container">
  <div class="glass-card change-password-card">
    <div class="card-header text-center">
      <div class="key-icon-wrapper">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2>Change Account Password</h2>
      <p class="text-muted">Ensure your account is using a long, random password to stay secure.</p>
    </div>

    <form (ngSubmit)="onChangePassword()" class="mt-4">
      <!-- Current Password with View / Eye Toggle Button -->
      <div class="form-group mb-3">
        <label class="form-label">Current Password *</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-shield-halved input-icon"></i>
          <input 
            [type]="showOldPassword ? 'text' : 'password'" 
            [(ngModel)]="oldPassword" 
            name="oldPassword" 
            class="form-control padded-input with-eye-input" 
            placeholder="Enter your current password"
            required 
          />
          <button type="button" class="eye-btn" (click)="toggleOldPassword()" title="Toggle password view">
            <i class="fa-solid" [ngClass]="showOldPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <!-- New Password with View / Eye Toggle Button -->
      <div class="form-group mb-3">
        <label class="form-label">New Password *</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input 
            [type]="showNewPassword ? 'text' : 'password'" 
            [(ngModel)]="newPassword" 
            name="newPassword" 
            class="form-control padded-input with-eye-input" 
            placeholder="Enter new password (min. 6 chars)"
            required 
          />
          <button type="button" class="eye-btn" (click)="toggleNewPassword()" title="Toggle password view">
            <i class="fa-solid" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Confirm New Password with View / Eye Toggle Button -->
      <div class="form-group mb-4">
        <label class="form-label">Confirm New Password *</label>
        <div class="input-icon-group">
          <i class="fa-solid fa-circle-check input-icon"></i>
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword" 
            class="form-control padded-input with-eye-input" 
            placeholder="Re-enter new password"
            required 
          />
          <button type="button" class="eye-btn" (click)="toggleConfirmPassword()" title="Toggle password view">
            <i class="fa-solid" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="isSubmitting">
        <i class="fa-solid fa-floppy-disk me-2"></i> Update Password
      </button>
    </form>
  </div>
</div>
