<div class="auth-page-wrapper">
  <div class="auth-glass-card glass-card">
    <div class="auth-header">
      <div class="brand-logo">
        <i class="fa-solid fa-utensils logo-icon"></i>
        <span class="brand-name">Mini<span>Swiggy</span></span>
      </div>
      <h2>Create an Account</h2>
      <p>Join MiniSwiggy for super fast food delivery!</p>
    </div>

    <form (ngSubmit)="register()" class="auth-form">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-user"></i>
          <input 
            type="text" 
            [(ngModel)]="registerModel.fullName" 
            name="fullName"
            class="form-control" 
            placeholder="John Doe" 
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-envelope"></i>
          <input 
            type="email" 
            [(ngModel)]="registerModel.email" 
            name="email"
            class="form-control" 
            placeholder="name@example.com" 
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number *</label>
        <div class="input-with-icon has-phone-prefix">
          <i class="fa-solid fa-phone"></i>
          <span class="phone-prefix-tag">+91</span>
          <input 
            type="tel" 
            [(ngModel)]="registerModel.phoneNumber" 
            name="phoneNumber"
            class="form-control" 
            placeholder="9876543210" 
            maxlength="10"
            inputmode="numeric"
            (keypress)="onlyNumbers($event)"
            (input)="onPhoneInput($event)"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password *</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock"></i>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            [(ngModel)]="registerModel.password" 
            name="password"
            class="form-control" 
            placeholder="••••••••" 
            required
          />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password *</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock"></i>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            [(ngModel)]="registerModel.confirmPassword" 
            name="confirmPassword"
            class="form-control" 
            placeholder="••••••••" 
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="registerModel.acceptTerms" name="acceptTerms" required />
          <span>I agree to Terms & Conditions</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 mt-2" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">CREATE ACCOUNT <i class="fa-solid fa-user-plus ms-1"></i></span>
        <span *ngIf="isSubmitting"><i class="fa-solid fa-spinner fa-spin me-2"></i> Registering...</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login" class="auth-link">Log In</a>
    </div>
  </div>
</div>
